version: '3.8'

services:
  db-farmacia:
    image: postgres:15-alpine
    container_name: postgres-farmacia
    environment:
      POSTGRES_DB: farmaciadb
      POSTGRES_USER: admin_db
      POSTGRES_PASSWORD: password_fuerte123
    ports:
      - "5432:5432" 
    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data: